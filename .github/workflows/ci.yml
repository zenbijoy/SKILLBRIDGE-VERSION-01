name: CI
on:
  pull_request:
  push:
    branches: [main, "upgrade/*", "release/*"]

jobs:
  preflight-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix admin
      - run: node scripts/doctor.mjs

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Audit Backend Dependencies
        run: npm audit --audit-level=high --prefix backend || true
      - name: Audit Admin Dependencies
        run: npm audit --audit-level=high --prefix admin || true

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: admin}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
