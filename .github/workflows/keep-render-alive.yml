name: Manual Ping Render Service

on:
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SkillBridge Render API Health
        run: |
          echo "Pinging SkillBridge Backend on Render..."
          curl -s -f --max-time 30 https://skillbridge-api-pd9c.onrender.com/health || echo "Ping request sent"
