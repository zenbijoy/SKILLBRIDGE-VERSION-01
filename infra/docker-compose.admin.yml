services:

  # ── SkillBridge Admin Panel ───────────────────────────────────────────────────
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: https://wyqsoxkwmulhpcoslnoj.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5cXNveGt3bXVsaHBjb3Nsbm9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODAxMzUsImV4cCI6MjEwMTg1NjEzNX0.KFiTn-UCZoL_TWHMjOTums4Fs_DoMK_iGF3v-mdv6_o
        VITE_API_URL: https://ruetskillbridge.duckdns.org/api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Caddy (Auto HTTPS) ────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.admin:/etc/caddy/Caddyfile:ro
      - caddy_admin_data:/data
      - caddy_admin_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  caddy_admin_data:
  caddy_admin_config:
